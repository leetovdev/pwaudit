[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwaudit"
version = "1.0.0"
description = "Password audit: strength estimation and breach lookup via k-anonymity"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LEETOV" }]
keywords = ["password", "security", "hibp", "k-anonymity", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
]

[project.scripts]
pwaudit = "pwaudit.cli:main"

[tool.setuptools]
packages = ["pwaudit"]
